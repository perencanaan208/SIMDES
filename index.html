<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1A3D0A; }

  #loader {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #1A3D0A 0%, #2E6B15 100%);
    z-index: 10;
    transition: opacity .4s ease, visibility .4s ease;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  #loader.hide { opacity: 0; visibility: hidden; pointer-events: none; }

  .logo-box {
    width: 72px; height: 72px; border-radius: 16px;
    background: rgba(255,255,255,.12);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 18px;
    padding: 8px;
  }
  .logo-box img { width: 100%; height: 100%; object-fit: contain; }
  .loader-title { color: #fff; font-size: 16px; font-weight: 700; letter-spacing: .3px; margin-bottom: 6px; }
  .loader-sub   { color: #C8E6A0; font-size: 12px; margin-bottom: 22px; }

  .spinner {
    width: 32px; height: 32px;
    border: 3px solid rgba(255,255,255,.25);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #app-frame {
    width: 100%; height: 100%;
    border: none; display: block;
  }

  #err-box {
    position: fixed; inset: 0;
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    background: #F0F4EE; z-index: 11; text-align: center; padding: 2rem;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  #err-box.show { display: flex; }
  #err-box h3 { color: #2E6B15; margin-bottom: 8px; font-size: 17px; }
  #err-box p  { color: #5A7050; font-size: 13px; max-width: 380px; line-height: 1.6; margin-bottom: 6px; }
  #err-box .retry-spinner {
    width: 22px; height: 22px; margin-top: 14px;
    border: 3px solid #D8E8D0; border-top-color: #2E6B15; border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  /* ============================================================ */
  /* PULL TO REFRESH (tarik layar ke bawah untuk reload, khusus HP) */
  /* ============================================================ */
  #ptr-zone {
    position: fixed; top: 0; left: 0; right: 0; height: 3px;
    z-index: 20; touch-action: none;
  }
  #ptr-indicator {
    position: fixed; top: -46px; left: 50%;
    width: 34px; height: 34px; margin-left: -17px;
    border-radius: 50%; background: #2E6B15; box-shadow: 0 2px 10px rgba(0,0,0,.25);
    display: flex; align-items: center; justify-content: center;
    z-index: 21; transition: top .25s ease, transform .2s ease;
  }
  #ptr-indicator svg { width: 18px; height: 18px; transition: transform .1s linear; }
  #ptr-indicator.spin svg { animation: spin 0.7s linear infinite; }
</style>

    <div class="loader-title">SIMDES — Desa Baleharjo</div>
    <div class="loader-sub">Sistem Informasi Manajemen Pembangunan Desa</div>
    <div class="spinner"></div>
  </div>

  <!-- FALLBACK JIKA IFRAME GAGAL DIMUAT (otomatis reload, tanpa tombol manual) -->
  <div id="err-box">
    <h3>⚠️ Gagal memuat aplikasi</h3>
    <p>Sepertinya koneksi terputus atau server sedang sibuk.<br>Mencoba menyambung ulang secara otomatis...</p>
    <div class="retry-spinner"></div>
  </div>

  <!-- ZONA & INDIKATOR PULL-TO-REFRESH (tarik layar ke bawah di HP untuk reload) -->
  <div id="ptr-zone"></div>
  <div id="ptr-indicator">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 1 1-3-6.7"></path>
      <polyline points="21 3 21 9 15 9"></polyline>
    </svg>
  </div>

  <!-- IFRAME PROXY KE GOOGLE APPS SCRIPT -->
  <iframe
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbzZs3Mos9WtF3V9YKnBz5YmRU5J1yhu_bmtyBQ7UlV6IYLJnAj10pwT-FnUdNqjeu1R/exec"
    title="SIMDES Desa Baleharjo"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="origin"
  ></iframe>

<script>
  const loader  = document.getElementById('loader');
  const frame   = document.getElementById('app-frame');
  const errBox  = document.getElementById('err-box');
  let loaded = false;

  // ============================================================
  // IKON APLIKASI DINAMIS — ambil ikon terbaru yang diupload Admin lewat
  // "Pengaturan > Ikon Aplikasi" di SIMDES, lalu terapkan ke favicon/
  // apple-touch-icon/manifest halaman WRAPPER ini (bukan ke iframe-nya).
  // Ini WAJIB dilakukan di sini (halaman wrapper), bukan di dalam HTML
  // yang disajikan Apps Script — karena keluaran HtmlService Apps Script
  // selalu dibungkus wrapper oleh Google sendiri, jadi <link> di dalamnya
  // tidak pernah terlihat oleh browser untuk kebutuhan "Install"/"Simpan
  // ke Layar Utama". Endpoint ?type=manifest sudah menyematkan ikonnya
  // sebagai Data URI langsung, jadi tidak perlu fetch tambahan ke Drive
  // (aman dari kendala CORS lintas-domain).
  (function terapkanIkonAplikasiDariSimdes() {
    try {
      const gasUrl = frame.getAttribute('src').split('?')[0];
      // PENTING: pakai endpoint ?type=iconUrl (mengembalikan URL gambar asli,
      // BUKAN ?type=manifest yang menyematkan ikon sebagai teks base64
      // raksasa). Proses Android "meracik" WebAPK (yang memunculkan
      // notifikasi "Menginstal...") perlu mengambil file ikon lewat URL
      // biasa dari servernya sendiri — kalau ikonnya berupa data URI base64
      // yang ditempel langsung di manifest, proses itu bisa macet tidak
      // pernah selesai (persis gejala notif instal yang tidak kunjung
      // beres). URL asli jauh lebih kecil & andal untuk kebutuhan ini.
      fetch(gasUrl + '?type=iconUrl')
        .then(function(res) { return res.json(); })
        .then(function(data) {
          const iconSrc = data && data.url;
          if (!iconSrc) return;
          const f32 = document.getElementById('wrapFavicon32');
          const f192 = document.getElementById('wrapFavicon192');
          const touch = document.getElementById('wrapTouchIcon');
          if (f32) f32.setAttribute('href', iconSrc);
          if (f192) f192.setAttribute('href', iconSrc);
          if (touch) touch.setAttribute('href', iconSrc);

          // Manifest dibuat ulang sebagai Blob DI HALAMAN INI (wrapper), bukan di
          // dalam iframe — supaya benar-benar terbaca browser untuk dialog
          // "Install this page as an app". start_url & scope SENGAJA menunjuk ke
          // origin wrapper INI SENDIRI (bukan ke URL Apps Script), karena syarat
          // "installability" Chrome mengharuskan start_url berada dalam origin
          // yang sama dengan halaman yang memuat manifest-nya — kalau menunjuk
          // origin lain (script.google.com), Chrome Android akan gagal
          // menganggapnya "app" penuh dan tetap memasang badge shortcut biasa.
          const manifestWrapper = {
            name: 'SIMDES — Desa Baleharjo',
            short_name: 'SIMDES',
            start_url: '/',
            scope: '/',
            display: 'standalone',
            background_color: '#F0F4EE',
            theme_color: '#2E6B15',
            icons: [
              { src: iconSrc, sizes: '192x192', type: 'image/png', purpose: 'any' },
              { src: iconSrc, sizes: '512x512', type: 'image/png', purpose: 'any' }
            ]
          };
          const blob = new Blob([JSON.stringify(manifestWrapper)], { type: 'application/json' });
          const manifestLink = document.getElementById('wrapManifestLink');
          if (manifestLink) manifestLink.setAttribute('href', URL.createObjectURL(blob));
        })
        .catch(function() { /* diam-diam gagal, tetap pakai manifest.json statis default di atas */ });
    } catch (e) { /* diam-diam gagal, bukan fitur kritikal */ }
  })();

  // ============================================================
  // SERVICE WORKER — WAJIB terdaftar (walau isinya minimal/kosong) supaya
  // Chrome Android menganggap halaman ini "benar-benar installable" dan
  // "Simpan ke Layar Utama" menghasilkan ikon bersih TANPA badge kecil
  // logo Chrome di pojoknya. Lihat isi lengkapnya & alasannya di sw.js.
  // ============================================================
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(function () {
      /* diam-diam gagal (mis. browser lama) — ikon tetap tampil, cuma
         mungkin masih dengan badge shortcut biasa */
    });
  }

  frame.addEventListener('load', () => {
    // PENTING: iframe 'load' cuma menandakan HTML/CSS/JS SIMDES sudah selesai
    // di-parse browser — BUKAN berarti datanya (dari Google Sheets) sudah siap.
    // Kalau loader disembunyikan di sini, akan kelihatan sekilas "tahap kedua"
    // loading kosong (0 kegiatan, dst) sebelum data asli benar-benar tampil.
    // Makanya loader BARU disembunyikan saat menerima pesan 'simdes:ready' dari
    // dalam SIMDES sendiri (dikirim tepat saat Dashboard selesai dirender),
    // supaya cuma ada SATU tahap loading yang mulus dari awal sampai akhir.
  });

  // Terima sinyal dari dalam SIMDES (iframe) bahwa data sudah selesai dimuat & Dashboard siap.
  window.addEventListener('message', function (e) {
    if (e && e.data && e.data.type === 'simdes:ready') {
      loaded = true;
      loader.classList.add('hide');
      errBox.classList.remove('show');
      try { sessionStorage.removeItem('simdesRetryCount'); } catch (e2) {}
    }
  });

  // Jika dalam 25 detik SIMDES belum kirim sinyal siap (kemungkinan diblokir / error /
  // koneksi ke Google Sheets lambat sekali), tampilkan pesan singkat lalu otomatis
  // reload halaman (tanpa perlu klik apa pun).
  setTimeout(() => {
    if (!loaded) {
      loader.classList.add('hide');
      errBox.classList.add('show');

      // Hitung jumlah percobaan berturut-turut supaya jeda sedikit lebih lama
      // kalau memang koneksi sedang bermasalah (hindari reload bertubi-tubi).
      let retryCount = 0;
      try { retryCount = parseInt(sessionStorage.getItem('simdesRetryCount') || '0', 10); } catch(e){}
      retryCount += 1;
      try { sessionStorage.setItem('simdesRetryCount', String(retryCount)); } catch(e){}

      const delay = Math.min(3000 + (retryCount - 1) * 2000, 10000); // 3s, 5s, 7s ... maks 10s
      setTimeout(() => { location.reload(); }, delay);
    }
  }, 25000);

  // Set judul tab tetap "SIMDES" walau iframe coba override
  setInterval(() => {
    if (document.title !== 'SIMDES — Desa Baleharjo') {
      document.title = 'SIMDES — Desa Baleharjo';
    }
  }, 1000);

  // ============================================================
  // PULL TO REFRESH — tarik layar ke bawah dari tepi atas untuk reload
  // (dipasang di zona tipis paling atas karena isi utama halaman adalah
  // iframe cross-origin yang tidak bisa "didengar" gesture-nya dari sini)
  // ============================================================
  (function () {
    const zone = document.getElementById('ptr-zone');
    const indicator = document.getElementById('ptr-indicator');
    const THRESHOLD = 70;   // jarak tarik (px) sebelum reload dipicu
    const MAX_PULL  = 110;  // batas visual indikator turun

    let startY = 0, pulling = false, currentPull = 0;

    zone.addEventListener('touchstart', (e) => {
      if (loaded === false && !errBox.classList.contains('show')) return; // biarkan loader awal jalan normal
      startY = e.touches[0].clientY;
      pulling = true;
      currentPull = 0;
    }, { passive: true });

    zone.addEventListener('touchmove', (e) => {
      if (!pulling) return;
      const dy = e.touches[0].clientY - startY;
      if (dy <= 0) { currentPull = 0; indicator.style.top = '-46px'; return; }
      currentPull = Math.min(dy, MAX_PULL);
      const topPos = -46 + (currentPull / MAX_PULL) * 76; // geser indikator turun mengikuti tarikan
      indicator.style.top = topPos + 'px';
      indicator.style.transform = 'rotate(' + (currentPull * 3) + 'deg)';
    }, { passive: true });

    zone.addEventListener('touchend', () => {
      if (!pulling) return;
      pulling = false;
      if (currentPull >= THRESHOLD) {
        indicator.classList.add('spin');
        indicator.style.top = '18px';
        indicator.style.transform = 'none';
        setTimeout(() => { location.reload(); }, 250);
      } else {
        indicator.style.top = '-46px';
        indicator.style.transform = 'none';
      }
      currentPull = 0;
    }, { passive: true });

    zone.addEventListener('touchcancel', () => {
      pulling = false; currentPull = 0;
      indicator.style.top = '-46px';
      indicator.style.transform = 'none';
    }, { passive: true });
  })();
</script>
